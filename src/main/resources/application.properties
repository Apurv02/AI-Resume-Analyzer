spring.application.name=ai-resume-analyzer
server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ai_resume_analyzer}
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}

# Optional: create an initial administrator at first startup.
# Set both variables in your environment; never commit real credentials.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
