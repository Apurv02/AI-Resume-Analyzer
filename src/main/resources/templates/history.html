<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>History · AI Resume Analyzer</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/nav :: nav}"></div><main class="page-wrap"><header class="page-heading"><div><span class="eyebrow">YOUR ARCHIVE</span><h1>Analysis history</h1><p>Every saved comparison, score and piece of feedback in one place.</p></div><a class="btn btn-primary" th:href="@{/dashboard}">New analysis <span>→</span></a></header>
<div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div>
<div class="empty-state" th:if="${#lists.isEmpty(records)}"><div class="empty-symbol">▤</div><h3>Your history is empty</h3><p>Run your first resume analysis to see it here.</p><a class="btn btn-primary" th:href="@{/dashboard}">Create analysis</a></div>
<div class="history-grid" th:unless="${#lists.isEmpty(records)}"><article class="history-card" th:each="r : ${records}"><div class="history-card-top"><div><span class="eyebrow">RESUME ANALYSIS</span><h3 th:text="${r.resumeName}">Resume name</h3><small th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy · HH:mm')}">Date</small></div><span class="score score-large" th:text="${r.score + '%'}">82%</span></div><p class="feedback-text" th:text="${r.feedback}">Feedback</p><div class="skill-tags" th:if="${!#lists.isEmpty(r.skills)}"><span th:each="skill : ${r.skills}" th:text="${skill}">Java</span></div><details><summary>View job description</summary><p class="job-text" th:text="${r.jobDescription}"></p></details><form th:action="@{/analyses/{id}/delete(id=${r.id})}" method="post" onsubmit="return confirm('Delete this analysis? This cannot be undone.');"><button class="btn btn-danger-outline" type="submit">Delete analysis</button></form></article></div>
</main></body></html>
