<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · AI Resume Analyzer</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/nav :: nav}"></div><main class="page-wrap"><header class="page-heading"><div><span class="eyebrow">ADMINISTRATION</span><h1>Platform overview</h1><p>Read-only overview of registered accounts and resume analyses.</p></div></header><section class="stats-grid"><article class="stat-card"><span>Registered users</span><strong th:text="${userCount}">0</strong></article><article class="stat-card"><span>Total analyses</span><strong th:text="${analysisCount}">0</strong></article></section><section class="panel table-panel"><h2>Recent analyses</h2><div class="table-wrap"><table><thead><tr><th>Resume</th><th>User</th><th>Score</th><th>Created</th></tr></thead><tbody><tr th:each="r : ${analyses}"><td th:text="${r.resumeName}"></td><td th:text="${r.userEmail}"></td><td th:text="${r.score + '%'}"></td><td th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy HH:mm')}"></td></tr></tbody></table></div></section><section class="panel table-panel"><h2>Users</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody><tr th:each="u : ${users}"><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td><td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}"></td></tr></tbody></table></div></section></main></body></html>
